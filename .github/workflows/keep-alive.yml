name: Keep Supabase Alive

on:
  schedule:
    # Jalan tiap 3 hari sekali jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Agar bisa kamu trigger manual via UI GitHub untuk pengetesan

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Supabase
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/poktans?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Response from Supabase:"
          echo "$RESPONSE"
          
          # Cek status code HTTP
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to ping Supabase! HTTP Status: $STATUS"
            exit 1
          fi
          echo "Supabase successfully pinged!"
